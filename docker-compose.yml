services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: find_reunite
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d find_reunite"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
